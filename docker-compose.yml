services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: podcast_transcription_search
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: podcast
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast -d podcast_transcription_search"]
      interval: 5s
      retries: 10

  web:
    image: ${IMAGE:-ghcr.io/macsatcom/podcast-transcription-search:latest}
    ports:
      - "0.0.0.0:${WEB_PORT:-8002}:8000"
      - "0.0.0.0:${PORTAL_PORT_RANGE:-9000-9010}:9000-9010"
    volumes:
      - ${DATA_DIR:-./data}/audio_cache:/tmp/audio
      - ${DATA_DIR:-./data}/portal_images:/app/portal_images
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://podcast:podcast@db/podcast_transcription_search
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      LOCAL_WHISPER_URL: "${LOCAL_WHISPER_URL:-http://whisper-cpu:9000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # CPU / NVIDIA GPU — onerahmet/openai-whisper-asr-webservice
  # Web bruger LOCAL_WHISPER_URL (default http://whisper-cpu:9000) til at forbinde
  # Ingen ports exposes — kører kun på Docker internt netværk
  whisper-cpu:
    image: onerahmet/openai-whisper-asr-webservice:latest
    profiles: ["whisper"]
    volumes:
      - ${DATA_DIR:-./data}/whisper_models:/root/.cache/whisper
    environment:
      - ASR_MODEL=large-v3
      - ASR_ENGINE=faster_whisper
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
    cpu_shares: 256
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

  # AMD ROCm — jjajjara/rocm-whisper-api
  whisper-rocm:
    image: jjajjara/rocm-whisper-api:latest
    profiles: ["whisper-rocm"]
    volumes:
      - ${DATA_DIR:-./data}/whisper_models:/root/.cache/whisper
    environment:
      - ASR_MODEL=large-v3
    devices:
      - /dev/kfd
      - /dev/dri
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped
