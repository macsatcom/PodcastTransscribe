services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: podcast_transcribe
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: podcast
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast -d podcast_transcribe"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "0.0.0.0:8002:8000"
      - "0.0.0.0:9000-9010:9000-9010"
    volumes:
      - audio_cache:/tmp/audio
      - portal_images:/app/portal_images
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://podcast:podcast@db/podcast_transcribe
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      LOCAL_WHISPER_URL: "${LOCAL_WHISPER_URL:-http://whisper-cpu:9000}"

  # CPU / NVIDIA GPU — onerahmet/openai-whisper-asr-webservice
  # Web bruger LOCAL_WHISPER_URL (default http://whisper-cpu:9000) til at forbinde
  whisper-cpu:
    image: onerahmet/openai-whisper-asr-webservice:latest
    profiles: ["whisper"]
    ports:
      - "0.0.0.0:9050:9000"
    volumes:
      - whisper_models:/root/.cache/whisper
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=faster_whisper
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

  # AMD ROCm — jjajjara/rocm-whisper-api
  whisper-rocm:
    image: jjajjara/rocm-whisper-api:latest
    profiles: ["whisper-rocm"]
    ports:
      - "0.0.0.0:9001:9000"
    volumes:
      - whisper_models:/root/.cache/whisper
    environment:
      - ASR_MODEL=large-v3
    devices:
      - /dev/kfd
      - /dev/dri
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

volumes:
  pgdata:
  audio_cache:
  portal_images:
  whisper_models:
