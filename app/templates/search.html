{% extends "base.html" %}
{% block content %}
<div x-data="searchView()" x-init="init()">
  <h1 class="page-title mb-6">Search</h1>

  <form @submit.prevent="doSearch()" class="flex flex-col gap-4 mb-6">
    <div>
      <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:6px;">Keywords (full-text search)</label>
      <input type="text" x-model="keyword" placeholder="e.g. wolf, climate, copenhagen..."
             class="input input-pill" style="padding:14px 20px;font-size:0.938rem;" @keyup.enter="doSearch()">
    </div>
    <div>
      <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:6px;">Natural language (semantic search)</label>
      <textarea x-model="natural" placeholder="e.g. What did they say about renewable energy?"
                class="input" style="border-radius:16px;padding:14px 20px;font-size:0.938rem;" rows="3" @keydown.enter.prevent="doSearch()"></textarea>
    </div>

    <div class="flex items-center justify-between">
      <div class="flex flex-wrap gap-3">
        <select x-model="podcastFilter" @change="loadEpisodes()" class="select">
          <option value="">All Items</option>
          <template x-for="p in podcasts" :key="p.id">
            <option :value="p.id" x-text="p.title"></option>
          </template>
        </select>
        <select x-model="mediaTypeFilter" class="select">
          <option value="">All Types</option>
          <option value="podcast">Podcasts</option>
          <option value="book">Audiobooks</option>
        </select>
        <select x-model="episodeFilter" class="select">
          <option value="">All Episodes</option>
          <template x-for="e in episodes" :key="e.id">
            <option :value="e.id" x-text="e.title"></option>
          </template>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Search</button>
    </div>
  </form>

  <div x-show="searched && !loading && results.length === 0" class="empty-state">
    <div class="empty-state-icon">&#x1F50D;</div>
    <p class="font-bold">No results found</p>
    <p class="text-sm mt-1" x-show="!searchMeta.threshold || searchMeta.candidate_count > 0">Try adjusting your search terms or filters.</p>
    <p class="text-sm mt-1" x-show="searchMeta.threshold && searchMeta.candidate_count === 0">
      No chunks scored above the relevance threshold
      (cosine distance ≤ <span x-text="searchMeta.threshold.toFixed(2)"></span>).
      Try a broader query or relax the threshold in Settings.
    </p>
  </div>

  <div class="flex flex-col gap-2">
    <template x-for="(r, idx) in results" :key="r.episode_id + (r.chunk_index || '')">
      <div class="card card-reveal" :style="'animation-delay:' + (idx * 0.03) + 's'" style="padding:16px;">
        <a :href="'/episodes/' + r.episode_id + '?q=' + encodeURIComponent(keyword || natural || '')" style="display:block;color:inherit;text-decoration:none;">
          <div class="flex items-start gap-3">
            <template x-if="r.cover_url">
              <img :src="r.cover_url" style="width:44px;height:44px;border-radius:4px;flex-shrink:0;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,0.3);">
            </template>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-2xs text-tertiary" x-text="r.podcast_title"></span>
                <span class="badge" :class="r.type === 'fts' ? 'badge-blue' : 'badge-green'" x-text="r.type === 'fts' ? 'Keyword' : 'Semantic'"></span>
                <span x-show="r.media_type" class="badge" :class="r.media_type === 'podcast' ? 'badge-green' : 'badge-blue'" x-text="r.media_type"></span>
              </div>
              <div class="font-bold truncate" style="font-size:0.875rem;" x-text="r.episode_title"></div>
              <div class="text-sm text-secondary mt-2 line-clamp-3" style="line-height:1.6;" x-html="r.snippet"></div>
              <div class="text-2xs text-tertiary mt-2" x-text="r.type === 'fts' ? 'Match: ' + keyword : 'Relevance: ' + (r.score || 0).toFixed(2)"></div>
            </div>
          </div>
        </a>
        <template x-if="r.chunks && r.chunks.length > 1">
          <div class="mt-3 pt-3" style="border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:6px;">
            <template x-for="c in r.chunks.slice(1)" :key="c.chunk_index">
              <a :href="'/episodes/' + r.episode_id + (c.start_time != null ? '?t=' + Math.floor(c.start_time) : '')"
                 class="text-2xs" style="display:block;color:var(--text-secondary);text-decoration:none;line-height:1.5;padding:6px 8px;border-radius:4px;background:var(--surface-subtle);">
                <span x-show="c.start_time != null" style="color:var(--accent);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums;"
                      x-text="formatTime(c.start_time)"></span>
                <span x-text="c.text.length > 220 ? c.text.slice(0, 220) + '…' : c.text"></span>
              </a>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>
</div>

<script>
function searchView() {
  return {
    keyword: '', natural: '', podcastFilter: '', episodeFilter: '', mediaTypeFilter: '',
    podcasts: [], episodes: [], results: [], loading: false, searched: false,
    searchMeta: { threshold: null, model: null, candidate_count: 0 },

    async init() { const r = await fetch('/api/podcasts'); this.podcasts = (await r.json()).filter(p => p.ready_count > 0); },

    formatTime(secs) {
      if (secs == null) return '';
      const s = Math.floor(secs);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
    },

    async loadEpisodes() {
      if (!this.podcastFilter) { this.episodes = []; return; }
      const r = await fetch('/api/episodes?podcast_id=' + this.podcastFilter);
      this.episodes = await r.json();
    },

    async doSearch() {
      if (!this.keyword.trim() && !this.natural.trim()) return;
      this.loading = true; this.searched = true;
      const params = new URLSearchParams();
      if (this.keyword.trim() && this.natural.trim()) { params.set('q', this.keyword); params.set('nq', this.natural); }
      else if (this.keyword.trim()) { params.set('q', this.keyword); params.set('mode', 'fts'); }
      else { params.set('q', this.natural); params.set('mode', 'semantic'); }
      if (this.podcastFilter) params.set('podcast_ids', this.podcastFilter);
      if (this.episodeFilter) params.set('episode_ids', this.episodeFilter);
      if (this.mediaTypeFilter) params.set('media_type', this.mediaTypeFilter);
      const r = await fetch('/api/search?' + params);
      const data = await r.json();
      this.results = data.results || [];
      this.searchMeta = {
        threshold: data.threshold ?? null,
        model: data.model ?? null,
        candidate_count: data.candidate_count ?? 0,
      };
      this.loading = false;
    }
  };
}
</script>
{% endblock %}
