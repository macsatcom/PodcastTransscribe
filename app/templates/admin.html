{% extends "base.html" %}
{% block content %}
<div x-data="adminView()" x-init="loadSettings()">
  <h1 class="page-title mb-6">Settings</h1>

  <div class="flex flex-col gap-6" style="max-width:560px;">

    <!-- Audiobookshelf -->
    <div class="card" style="padding:20px;">
      <h2 class="section-title mb-3">Audiobookshelf</h2>
      <div class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">URL</label>
          <input type="text" x-model="absUrl" class="input" placeholder="http://192.168.1.x:13378">
        </div>
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">API Key</label>
          <input type="password" x-model="absApiKey" class="input" placeholder="eyJ...">
        </div>
        <div class="flex items-center gap-3">
          <button @click="saveAndTestAbs()" :disabled="savingAbs" class="btn btn-primary" x-text="savingAbs ? 'Testing...' : 'Save & Test Connection'"></button>
          <span x-text="absStatus" class="text-sm font-medium" :class="absOk ? 'text-accent' : 'text-red'"></span>
        </div>
      </div>
    </div>

    <!-- OpenRouter -->
    <div class="card" style="padding:20px;">
      <h2 class="section-title mb-3">OpenRouter</h2>
      <div class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">API Key</label>
          <input type="password" x-model="apiKey" class="input" placeholder="sk-...">
        </div>
        <div class="flex items-center gap-3">
          <button @click="saveSettings()" :disabled="saving" class="btn btn-primary" x-text="saving ? 'Saving...' : 'Save & Load Models'"></button>
          <span x-text="saveStatus" class="text-sm font-medium text-accent"></span>
        </div>

        <template x-if="modelsLoaded">
          <div class="flex flex-col gap-3 mt-2">
            <div>
              <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Transcription Model</label>
              <select x-model="transcriptionModel" class="select w-full" style="border-radius:6px;">
                <option value="">Select model...</option>
                <optgroup label="Local">
                  <option value="local-whisper">local-whisper (indbygget)</option>
                  <option value="self-hosted-whisper">self-hosted-whisper (ekstern)</option>
                </optgroup>
                <optgroup label="OpenRouter Audio">
                  <template x-for="m in models.chat_audio" :key="m">
                    <option :value="m" x-text="m"></option>
                  </template>
                </optgroup>
                <optgroup label="OpenRouter Transcription">
                  <template x-for="m in models.transcription" :key="m">
                    <option :value="m" x-text="m"></option>
                  </template>
                </optgroup>
              </select>
            </div>

            <div>
              <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Summarization Model</label>
              <select x-model="summarizationModel" class="select w-full" style="border-radius:6px;">
                <option value="">Select model...</option>
                <template x-for="m in models.chat" :key="m">
                  <option :value="m" x-text="m"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Embedding Model</label>
              <select x-model="embeddingModel" class="select w-full" style="border-radius:6px;">
                <option value="">Select model...</option>
                <template x-for="m in models.embedding" :key="m">
                  <option :value="m" x-text="m"></option>
                </template>
              </select>
              <p class="text-xs text-secondary" style="margin-top:4px;">
                Changing this re-embeds every transcript chunk in the background. You'll be asked to confirm.
              </p>
            </div>

            <div>
              <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">
                Semantic distance threshold
                <span class="text-secondary" x-text="'(' + semanticThreshold + ')'"></span>
              </label>
              <input type="range" min="0.30" max="0.60" step="0.01" x-model.number="semanticThreshold" class="w-full">
              <p class="text-xs text-secondary" style="margin-top:4px;">
                Lower = stricter (fewer, more relevant hits). Sweet spot 0.35&ndash;0.45. Default 0.40.
              </p>
            </div>

            <template x-if="reembed.status === 'running'">
              <div class="card" style="background:var(--bg-tertiary);padding:12px;border-radius:8px;">
                <div class="text-sm font-medium" style="margin-bottom:6px;">Re-embedding in progress</div>
                <div class="text-xs text-secondary" x-text="'Target: ' + reembed.target_model"></div>
                <div class="text-xs text-secondary" x-text="'Progress: ' + reembed.progress"></div>
                <button @click="cancelReembed()" class="btn btn-secondary" style="margin-top:8px;">Cancel</button>
              </div>
            </template>
            <template x-if="reembed.status === 'error'">
              <div class="text-sm" style="color:var(--danger);">
                Re-embed run failed. Check server logs and re-save the model to retry.
              </div>
            </template>

            <div>
              <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Self-hosted Whisper URL</label>
              <input type="text" x-model="selfHostedUrl" class="input" placeholder="http://192.168.1.100:9000">
            </div>

            <div class="flex items-center gap-3">
              <button @click="saveModels()" class="btn btn-primary">Save Model Choices</button>
              <span x-text="modelSaveStatus" class="text-sm font-medium text-accent"></span>
            </div>
          </div>
        </template>

        <template x-if="!modelsLoaded && modelsLoading">
          <div class="flex items-center gap-3 text-sm text-secondary mt-2">
            <div class="spinner"></div> Loading models...
          </div>
        </template>

        <p x-show="loadError" x-text="loadError" class="text-sm text-red mt-2"></p>
      </div>
    </div>

    <!-- Public Portals -->
    <div class="card" style="padding:20px;">
      <h2 class="section-title mb-3">Public Portals</h2>
      <div x-data="portalManager()" x-init="loadPortals()">
        <button @click="showForm = true; editing = null" class="btn btn-primary btn-sm mb-4" x-show="!showForm">+ New Portal</button>

        <div x-show="showForm" class="flex flex-col gap-3 mb-4" style="padding:16px;background:var(--bg-elevated);border-radius:8px;">
          <div>
            <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Title</label>
            <input x-model="form.title" placeholder="Portal title" class="input" style="border-radius:6px;">
          </div>
          <div>
            <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Port</label>
            <input x-model.number="form.port" type="number" placeholder="e.g. 9001" class="input" style="border-radius:6px;">
          </div>
          <div>
            <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Description</label>
            <input x-model="form.description" placeholder="Optional description" class="input" style="border-radius:6px;">
          </div>
          <div>
            <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Background Image URL</label>
            <input x-model="form.background_image" placeholder="https://... or leave empty" class="input" style="border-radius:6px;">
          </div>
          <div>
            <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Secondary Image URL</label>
            <input x-model="form.secondary_image" placeholder="https://... or leave empty" class="input" style="border-radius:6px;">
          </div>
          <div>
            <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Podcasts</label>
            <div class="flex flex-col gap-1" style="max-height:160px;overflow-y:auto;padding:8px;background:var(--bg-surface);border-radius:6px;border:1px solid var(--border-subtle);">
              <template x-for="p in podcasts" :key="p.id">
                <label class="flex items-center gap-2 text-sm cursor-pointer" style="padding:2px 0;">
                  <input type="checkbox" :checked="form.podcast_ids.includes(p.id)"
                         @change="togglePodcast(p.id)" class="checkbox" style="width:14px;height:14px;">
                  <span x-text="p.title"></span>
                </label>
              </template>
            </div>
          </div>
          <label class="flex items-center gap-3 text-sm cursor-pointer" style="padding:4px 0;">
            <input type="checkbox" x-model="form.enabled" class="checkbox">
            <span class="font-medium">Start on boot</span>
            <span class="text-2xs text-tertiary">Automatically start when container restarts</span>
          </label>
          <div class="flex gap-2">
            <button @click="editing ? updatePortal() : createPortal()" class="btn btn-primary btn-sm"
                    x-text="editing ? 'Update' : 'Create'"></button>
            <button @click="showForm = false" class="btn btn-ghost btn-sm">Cancel</button>
          </div>
        </div>

        <template x-for="p in portals" :key="p.id">
          <div class="table-row" style="padding:12px 16px;border-bottom:1px solid var(--border-subtle);">
            <div class="min-w-0 flex-1">
              <div x-text="p.title" class="font-bold text-sm"></div>
              <div class="text-2xs text-tertiary" x-text="'Port ' + p.port + ' \u00b7 ' + (p.podcast_ids?.length || 0) + ' podcasts'"></div>
              <div x-show="p.background_image" class="text-2xs text-tertiary" x-text="'BG: ' + p.background_image.split('/').pop()"></div>
              <div x-show="p.secondary_image" class="text-2xs text-tertiary" x-text="'Sec: ' + p.secondary_image.split('/').pop()"></div>
            </div>
            <div class="flex items-center gap-2">
              <span class="badge" :class="p.running ? 'badge-green' : 'badge-gray'" x-text="p.running ? 'Running' : 'Stopped'"></span>
              <button @click="toggleBoot(p)" class="btn btn-ghost btn-sm" style="font-size:0.75rem;padding:2px 8px;" x-text="p.enabled ? 'Boot: on' : 'Boot: off'"
                      :class="p.enabled ? 'text-accent' : 'text-secondary'"></button>
              <button @click="editPortal(p)" class="btn btn-ghost btn-sm text-accent">Edit</button>
              <button @click="togglePortal(p)" class="btn btn-ghost btn-sm" :class="p.running ? 'text-red' : 'text-accent'" x-text="p.running ? 'Stop' : 'Start'"></button>
              <button @click="deletePortal(p)" class="btn btn-ghost btn-sm text-red">Delete</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <template x-if="confirm.open">
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:50;">
      <div class="card" style="background:var(--bg-primary);max-width:480px;padding:24px;border-radius:12px;">
        <h3 class="text-lg font-semibold" style="margin-bottom:8px;">Re-embed all transcripts?</h3>
        <p class="text-sm text-secondary" style="margin-bottom:12px;">
          Switching to <span class="font-medium" x-text="confirm.target"></span> will re-embed
          <span class="font-medium" x-text="confirm.chunks"></span> chunks across
          <span class="font-medium" x-text="confirm.episodes"></span> episodes in the background.
          Search may return reduced results until the run completes.
        </p>
        <div class="flex items-center gap-3" style="justify-content:flex-end;">
          <button @click="cancelConfirm()" class="btn btn-secondary">Cancel</button>
          <button @click="confirmReembed()" class="btn btn-primary">Re-embed</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function portalManager() {
  return {
    showForm: false, editing: null, portals: [], podcasts: [],
    form: { title: '', port: 9001, description: '', podcast_ids: [], background_image: '', secondary_image: '', enabled: true },

    async loadPortals() {
      const [pr, pdr] = await Promise.all([fetch('/api/portals'), fetch('/api/podcasts')]);
      this.portals = await pr.json();
      this.podcasts = (await pdr.json()).filter(p => p.media_type !== 'ebook' && p.ready_count > 0);
    },

    togglePodcast(id) {
      const idx = this.form.podcast_ids.indexOf(id);
      if (idx > -1) this.form.podcast_ids.splice(idx, 1);
      else this.form.podcast_ids.push(id);
    },

    editPortal(p) {
      this.editing = p.id;
      this.form = {
        title: p.title, port: p.port, description: p.description || '',
        podcast_ids: [...(p.podcast_ids || [])],
        background_image: p.background_image || '',
        secondary_image: p.secondary_image || '',
        enabled: p.enabled || false,
      };
      this.showForm = true;
    },

    async createPortal() {
      const r = await fetch('/api/portals', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(this.form) });
      if (r.ok) {
        const data = await r.json();
        if (this.form.background_image || this.form.secondary_image) {
          await this._uploadImages(data.id);
        }
      }
      this.showForm = false; this.form = { title: '', port: 9001, description: '', podcast_ids: [], background_image: '', secondary_image: '', enabled: true };
      await this.loadPortals();
    },

    async updatePortal() {
      const r = await fetch('/api/portals/' + this.editing, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(this.form) });
      if (r.ok && (this.form.background_image || this.form.secondary_image)) {
        await this._uploadImages(this.editing);
      }
      this.showForm = false; this.editing = null;
      this.form = { title: '', port: 9001, description: '', podcast_ids: [], background_image: '', secondary_image: '', enabled: true };
      await this.loadPortals();
    },

    async _uploadImages(portalId) {
      for (const type of ['background', 'secondary']) {
        const url = this.form[type + '_image'];
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
          const blob = await fetch(url).then(r => r.blob()).catch(() => null);
          if (blob) {
            const fd = new FormData();
            fd.append('file', blob, type + '.jpg');
            await fetch('/api/portals/' + portalId + '/upload-image?image_type=' + type, { method: 'POST', body: fd });
          }
        }
      }
    },

    async togglePortal(p) { await fetch('/api/portals/' + p.id + '/' + (p.running ? 'stop' : 'start'), { method: 'POST' }); await this.loadPortals(); },
    async toggleBoot(p) {
      await fetch('/api/portals/' + p.id, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({enabled: !p.enabled}) });
      p.enabled = !p.enabled;
    },
    async deletePortal(p) { await fetch('/api/portals/' + p.id, { method: 'DELETE' }); await this.loadPortals(); },
  };
}

function adminView() {
  return {
    apiKey: '', transcriptionModel: '', summarizationModel: '', embeddingModel: '', selfHostedUrl: '',
    absUrl: '', absApiKey: '', absStatus: '', absOk: false, savingAbs: false,
    saveStatus: '', modelSaveStatus: '', saving: false,
    models: { transcription: [], chat: [], embedding: [] }, modelsLoaded: false, modelsLoading: false, loadError: '',
    semanticThreshold: 0.40,
    _initialEmbeddingModel: '',
    _initialThreshold: 0.40,
    reembed: { status: 'idle', progress: '0/0', target_model: '' },
    confirm: { open: false, target: '', chunks: 0, episodes: 0 },
    _statusTimer: null,

    async loadSettings() {
      const r = await fetch('/api/settings');
      const data = await r.json();
      this.apiKey = data.openrouter_api_key || '';
      this.selfHostedUrl = data.self_hosted_whisper_url || '';
      this.absUrl = data.abs_url || '';
      this.absApiKey = data.abs_api_key || '';

      if (this.apiKey) {
        await this.fetchModels();
        await this.$nextTick();
      }

      this.transcriptionModel = data.transcription_model || '';
      this.summarizationModel = data.summarization_model || '';
      this.embeddingModel = data.embedding_model || '';
      this._initialEmbeddingModel = this.embeddingModel;

      const threshold = parseFloat(data.semantic_distance_threshold);
      if (!isNaN(threshold)) this.semanticThreshold = threshold;
      this._initialThreshold = this.semanticThreshold;

      await this.refreshReembedStatus();
    },

    async saveAndTestAbs() {
      this.savingAbs = true; this.absStatus = ''; this.absOk = false;
      const body = {};
      if (this.absUrl) body.abs_url = this.absUrl;
      if (this.absApiKey) body.abs_api_key = this.absApiKey;
      await fetch('/api/settings', { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
      try {
        const r = await fetch('/api/settings/abs/test'); const data = await r.json();
        if (data.ok) { this.absStatus = 'Connection OK'; this.absOk = true; }
        else { this.absStatus = 'Error: ' + (data.error || 'Unknown'); }
      } catch (e) { this.absStatus = 'Request failed'; }
      this.savingAbs = false;
    },

    async saveSettings() {
      this.saving = true; this.saveStatus = ''; this.loadError = '';
      const body = {};
      if (this.apiKey) body.openrouter_api_key = this.apiKey;
      if (this.selfHostedUrl) body.self_hosted_whisper_url = this.selfHostedUrl;
      const r = await fetch('/api/settings', { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
      if (r.ok) { this.saveStatus = 'Saved!'; await this.fetchModels(); setTimeout(() => this.saveStatus = '', 2000); }
      else { this.saveStatus = 'Error saving'; }
      this.saving = false;
    },

    async fetchModels() {
      this.modelsLoading = true; this.loadError = '';
      try {
        const r = await fetch('/api/settings/models');
        if (!r.ok) throw new Error('Failed to load models');
        this.models = await r.json(); this.modelsLoaded = true;
      } catch (e) { this.loadError = 'Could not load models. Is your API key valid?'; }
      this.modelsLoading = false;
    },

    async saveModels() {
      const embeddingChanged =
        this.embeddingModel && this.embeddingModel !== this._initialEmbeddingModel;

      if (embeddingChanged) {
        try {
          const r = await fetch(
            '/api/settings/reembed/estimate?target_model=' +
              encodeURIComponent(this.embeddingModel)
          );
          const est = await r.json();
          this.confirm = {
            open: true,
            target: this.embeddingModel,
            chunks: est.chunks || 0,
            episodes: est.episodes || 0,
          };
        } catch (e) {
          this.modelSaveStatus = 'Could not estimate re-embed scope.';
        }
        return;
      }

      await this._writeModels();
    },

    async _writeModels() {
      const body = {};
      if (this.transcriptionModel) body.transcription_model = this.transcriptionModel;
      if (this.summarizationModel) body.summarization_model = this.summarizationModel;
      if (this.embeddingModel) body.embedding_model = this.embeddingModel;
      if (this.selfHostedUrl) body.self_hosted_whisper_url = this.selfHostedUrl;
      body.semantic_distance_threshold = String(this.semanticThreshold);
      const r = await fetch('/api/settings', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      if (r.ok) {
        this.modelSaveStatus = 'Saved!';
        setTimeout(() => this.modelSaveStatus = '', 2000);
        this._initialEmbeddingModel = this.embeddingModel;
        this._initialThreshold = this.semanticThreshold;
        await this.refreshReembedStatus();
      } else {
        this.modelSaveStatus = 'Error saving';
      }
    },

    async confirmReembed() {
      this.confirm.open = false;
      await this._writeModels();
    },

    cancelConfirm() {
      this.confirm.open = false;
      this.embeddingModel = this._initialEmbeddingModel;
    },

    async cancelReembed() {
      await fetch('/api/settings/reembed/cancel', { method: 'POST' });
      await this.refreshReembedStatus();
    },

    async refreshReembedStatus() {
      try {
        const r = await fetch('/api/settings/reembed/status');
        if (!r.ok) return;
        this.reembed = await r.json();
      } catch (e) { /* ignore */ }

      if (this._statusTimer) {
        clearTimeout(this._statusTimer);
        this._statusTimer = null;
      }
      if (this.reembed.status === 'running') {
        this._statusTimer = setTimeout(() => this.refreshReembedStatus(), 3000);
      }
    },
  };
}
</script>
{% endblock %}
