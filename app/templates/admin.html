{% extends "base.html" %}
{% block content %}
<div x-data="adminView()" x-init="loadSettings()">
  <h1 class="text-2xl font-bold mb-6">Admin / Settings</h1>

  <div class="grid gap-6 max-w-lg">
    <div class="p-4 bg-gray-900 rounded-lg border border-gray-800">
      <h2 class="font-semibold mb-3">OpenRouter</h2>
      <label class="block text-sm mb-1">API Key</label>
      <input type="password" x-model="apiKey" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-sm mb-3" placeholder="sk-...">

      <button @click="saveSettings()" :disabled="saving" class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-4 py-2 rounded text-sm font-medium mb-4">
        <span x-text="saving ? 'Saving...' : 'Save & Load Models'"></span>
      </button>
      <span x-text="saveStatus" class="text-sm ml-2"></span>

      <template x-if="modelsLoaded">
        <div>
          <label class="block text-sm mb-1 mt-3">Transcription (Whisper / Audio endpoint)</label>
          <select x-model="transcriptionModel" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-sm mb-3">
            <option value="">Select model...</option>
            <template x-for="m in models.transcription" :key="m">
              <option :value="m" x-text="m" :selected="m === transcriptionModel"></option>
            </template>
          </select>

          <label class="block text-sm mb-1">Audio Chat (Multimodal / Chat completions)</label>
          <select x-model="chatAudioModel" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-sm mb-3">
            <option value="">Select model...</option>
            <template x-for="m in models.chat_audio" :key="m">
              <option :value="m" x-text="m" :selected="m === chatAudioModel"></option>
            </template>
          </select>

          <label class="block text-sm mb-1">Summarization Model</label>
          <select x-model="summarizationModel" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-sm mb-3">
            <option value="">Select model...</option>
            <template x-for="m in models.chat" :key="m">
              <option :value="m" x-text="m" :selected="m === summarizationModel"></option>
            </template>
          </select>

          <label class="block text-sm mb-1">Embedding Model</label>
          <select x-model="embeddingModel" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-sm mb-3">
            <option value="">Select model...</option>
            <template x-for="m in models.embedding" :key="m">
              <option :value="m" x-text="m" :selected="m === embeddingModel"></option>
            </template>
          </select>

          <label class="block text-sm mb-1 mt-3">Jetson Whisper URL (hvis du bruger jetson-whisper)</label>
          <input type="text" x-model="jetsonUrl" placeholder="http://192.168.1.100:9000"
                 class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-sm mb-3">

          <button @click="saveModels()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-medium">Save Model Choices</button>
          <span x-text="modelSaveStatus" class="text-sm ml-2"></span>
        </div>
      </template>

      <template x-if="!modelsLoaded && modelsLoading">
        <p class="text-sm text-gray-400 mt-2">Loading models...</p>
      </template>

      <p x-show="loadError" x-text="loadError" class="text-sm text-red-400 mt-2"></p>
    </div>

    <div class="mt-6 p-4 bg-gray-900 rounded-lg border border-gray-800">
      <h2 class="font-semibold mb-3">Public Portals</h2>
      <div x-data="portalManager()" x-init="loadPortals()">
        <button @click="showForm = true" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded text-xs mb-4">+ New Portal</button>

        <div x-show="showForm" class="mb-4 p-3 bg-gray-800 rounded space-y-2">
          <input x-model="form.title" placeholder="Title" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-sm">
          <input x-model="form.port" type="number" placeholder="Port (e.g. 9001)" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-sm">
          <input x-model="form.description" placeholder="Description" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-sm">
          <select x-model="form.podcast_ids" multiple class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-sm h-24">
            <template x-for="p in podcasts" :key="p.id">
              <option :value="p.id" x-text="p.title"></option>
            </template>
          </select>
          <div class="flex gap-2">
            <button @click="createPortal()" class="bg-emerald-600 px-3 py-1 rounded text-xs">Create</button>
            <button @click="showForm = false" class="text-xs text-gray-400">Cancel</button>
          </div>
        </div>

        <template x-for="p in portals" :key="p.id">
          <div class="p-2 bg-gray-800 rounded mb-2 text-sm">
            <div class="flex items-center justify-between">
              <div>
                <div x-text="p.title" class="font-medium"></div>
                <div class="text-xs text-gray-500" x-text="'Port ' + p.port + ' · ' + (p.podcast_ids?.length || 0) + ' podcasts'"></div>
                <div x-show="p.background_image" class="text-xs text-gray-600" x-text="'BG: ' + p.background_image"></div>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs px-1.5 py-0.5 rounded" :class="p.running ? 'bg-emerald-700 text-emerald-200' : 'bg-gray-700 text-gray-400'" x-text="p.running ? 'Running' : 'Stopped'"></span>
                <button @click="togglePortal(p)" class="text-xs" :class="p.running ? 'text-red-400' : 'text-emerald-400'" x-text="p.running ? 'Stop' : 'Start'"></button>
                <button @click="deletePortal(p)" class="text-xs text-red-400">Delete</button>
              </div>
            </div>
            <div class="mt-2 space-y-2">
              <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500 w-16">BG image:</span>
                <input x-model="bgUrls[p.id]" placeholder="Image URL..." @keydown.enter="setImageUrl(p.id, 'background', bgUrls[p.id])"
                       class="flex-1 p-1 rounded bg-gray-700 border border-gray-600 text-xs">
                <form @submit.prevent="uploadImage(p, 'background')" class="flex items-center gap-1">
                  <input type="file" accept="image/*" :data-portal="p.id" data-type="background" class="text-xs text-gray-400 w-32">
                  <button type="submit" class="text-xs text-emerald-400 hover:text-emerald-300">Upload</button>
                </form>
                <span x-show="p.background_image" class="text-xs text-gray-600 truncate max-w-[120px]" x-text="p.background_image.split('/').pop()"></span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500 w-16">Sec image:</span>
                <input x-model="secUrls[p.id]" placeholder="Image URL..." @keydown.enter="setImageUrl(p.id, 'secondary', secUrls[p.id])"
                       class="flex-1 p-1 rounded bg-gray-700 border border-gray-600 text-xs">
                <form @submit.prevent="uploadImage(p, 'secondary')" class="flex items-center gap-1">
                  <input type="file" accept="image/*" :data-portal="p.id" data-type="secondary" class="text-xs text-gray-400 w-32">
                  <button type="submit" class="text-xs text-emerald-400 hover:text-emerald-300">Upload</button>
                </form>
                <span x-show="p.secondary_image" class="text-xs text-gray-600 truncate max-w-[120px]" x-text="p.secondary_image.split('/').pop()"></span>
              </div>
            </div>
          </div>
        </template>
        <p x-show="portals.length === 0" class="text-xs text-gray-500">No portals yet.</p>
      </div>
    </div>
  </div>
</div>

<script>
function portalManager() {
  return {
    showForm: false,
    portals: [],
    podcasts: [],
    form: { title: '', port: 9001, description: '', podcast_ids: [] },
    bgUrls: {},
    secUrls: {},

    async loadPortals() {
      const [pr, pdr] = await Promise.all([
        fetch('/api/portals'),
        fetch('/api/podcasts'),
      ]);
      this.portals = await pr.json();
      this.podcasts = await pdr.json();
    },

    async createPortal() {
      await fetch('/api/portals', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(this.form),
      });
      this.showForm = false;
      this.form = { title: '', port: 9001, description: '', podcast_ids: [] };
      await this.loadPortals();
    },

    async togglePortal(p) {
      await fetch(`/api/portals/${p.id}/${p.running ? 'stop' : 'start'}`, { method: 'POST' });
      await this.loadPortals();
    },

    async deletePortal(p) {
      await fetch(`/api/portals/${p.id}`, { method: 'DELETE' });
      await this.loadPortals();
    },

    async uploadImage(p, imageType) {
      const input = document.querySelector(`input[data-portal="${p.id}"][data-type="${imageType}"]`);
      if (!input || !input.files[0]) return;
      const fd = new FormData();
      fd.append('file', input.files[0]);
      fd.append('image_type', imageType);
      await fetch(`/api/portals/${p.id}/upload-image`, {
        method: 'POST',
        body: fd,
      });
      await this.loadPortals();
    },

    async setImageUrl(portalId, field, url) {
      if (!url.trim()) return;
      const key = field === 'background' ? 'background_image' : 'secondary_image';
      await fetch(`/api/portals/${portalId}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({[key]: url}),
      });
      await this.loadPortals();
    },
  };
}
</script>

<script>
function adminView() {
  return {
    apiKey: '',
      transcriptionModel: '',
      chatAudioModel: '',
      summarizationModel: '',
      embeddingModel: '',
      jetsonUrl: '',
      saveStatus: '',
    modelSaveStatus: '',
    saving: false,
    models: { transcription: [], chat: [], embedding: [] },
    modelsLoaded: false,
    modelsLoading: false,
    loadError: '',

    async loadSettings() {
      const r = await fetch('/api/settings');
      const data = await r.json();
      this.apiKey = data.openrouter_api_key || '';
      this.transcriptionModel = data.transcription_model || '';
      this.chatAudioModel = data.chat_audio_model || '';
      this.summarizationModel = data.summarization_model || '';
      this.embeddingModel = data.embedding_model || '';
      this.jetsonUrl = data.jetson_whisper_url || '';
      if (this.apiKey) await this.fetchModels();
    },

    async saveSettings() {
      this.saving = true;
      this.saveStatus = '';
      this.loadError = '';
      const body = {};
      if (this.apiKey) body.openrouter_api_key = this.apiKey;
      if (this.jetsonUrl) body.jetson_whisper_url = this.jetsonUrl;

      const r = await fetch('/api/settings', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      if (r.ok) {
        this.saveStatus = 'Saved!';
        await this.fetchModels();
        setTimeout(() => this.saveStatus = '', 2000);
      } else {
        this.saveStatus = 'Error saving';
      }
      this.saving = false;
    },

    async fetchModels() {
      this.modelsLoading = true;
      this.loadError = '';
      try {
        const r = await fetch('/api/settings/models');
        if (!r.ok) throw new Error('Failed to load models');
        this.models = await r.json();
        this.modelsLoaded = true;
      } catch (e) {
        this.loadError = 'Could not load models. Is your API key valid?';
      }
      this.modelsLoading = false;
    },

    async saveModels() {
      const body = {};
      if (this.transcriptionModel) body.transcription_model = this.transcriptionModel;
      if (this.chatAudioModel) body.chat_audio_model = this.chatAudioModel;
      if (this.summarizationModel) body.summarization_model = this.summarizationModel;
      if (this.embeddingModel) body.embedding_model = this.embeddingModel;

      const r = await fetch('/api/settings', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      if (r.ok) {
        this.modelSaveStatus = 'Saved!';
        setTimeout(() => this.modelSaveStatus = '', 2000);
      } else {
        this.modelSaveStatus = 'Error saving';
      }
    }
  };
}
</script>
{% endblock %}
