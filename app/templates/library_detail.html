{% extends "base.html" %}
{% block content %}
<div x-data="itemDetail()" x-init="loadItem()">
  <a href="/" class="text-sm font-medium text-secondary hover:text-primary mb-4 inline-block" style="display:flex;align-items:center;gap:4px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>

  <div x-show="loading" class="flex flex-col gap-4 mb-6">
    <div class="flex items-center gap-4">
      <div class="skeleton" style="width:80px;height:80px;border-radius:8px;"></div>
      <div class="flex-1 flex flex-col gap-2">
        <div class="skeleton" style="width:60%;height:24px;"></div>
        <div class="skeleton" style="width:30%;height:14px;"></div>
      </div>
    </div>
  </div>

  <div x-show="!loading" class="mb-6">
    <div class="flex items-center gap-4">
      <template x-if="item.cover_url">
        <img :src="item.cover_url" style="width:80px;height:80px;border-radius:8px;flex-shrink:0;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,0.5);">
      </template>
      <div>
        <div class="flex items-center gap-3">
          <h1 class="page-title" x-text="item.title"></h1>
          <span class="badge" :class="item.media_type === 'podcast' ? 'badge-green' : item.media_type === 'book' ? 'badge-blue' : 'badge-gray'" x-text="item.media_type"></span>
        </div>
        <p class="text-sm text-secondary mt-1">
          <span x-show="item.author" x-text="item.author"></span>
          <span x-show="item.author && item.narrator"> &middot; </span>
          <span x-show="item.narrator" class="text-tertiary" x-text="item.narrator"></span>
        </p>

        <div class="flex items-center gap-4 mt-4">
          <label x-show="item.media_type === 'podcast'" class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" x-model="autoProcess" @change="toggleAutoProcess()" class="checkbox">
            <span class="font-medium">Auto-process new episodes</span>
          </label>
          <button x-show="item.media_type === 'book'" @click="enqueueAllPending()" :disabled="transcribing" class="btn btn-primary">
            <span x-text="transcribing ? 'Enqueuing...' : 'Transcribe Book'"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div x-show="!loading" x-cloak>
    <div class="flex items-center justify-between mb-3">
      <h2 class="section-title" x-text="item.media_type === 'podcast' ? 'Episodes' : 'Chapters'"></h2>
    </div>

    <div class="flex items-center gap-3 mb-4">
      <label class="flex items-center gap-2 text-xs font-medium text-secondary cursor-pointer">
        <input type="checkbox" @change="selectAll($event)" class="checkbox"> Select all
      </label>
      <button @click="transcribeSelected()" x-show="selectedIds.length > 0" :disabled="transcribing"
              class="btn btn-primary btn-sm" x-text="'Transcribe Selected (' + selectedIds.length + ')'">
      </button>
    </div>

    <div class="tabs mb-4">
      <template x-for="s in statusFilters" :key="s.key">
        <button @click="statusFilter = s.key" class="tab" :class="{ active: statusFilter === s.key }" x-text="s.label"></button>
      </template>
    </div>

    <div class="flex flex-col gap-1">
      <template x-for="ep in filteredEpisodes" :key="ep.our_episode_id || ep.id || Math.random()">
        <div class="flex items-start gap-3" style="padding:12px 16px;background:var(--bg-surface);border-radius:6px;border:1px solid var(--border-subtle);">
          <input type="checkbox" :checked="selectedIds.includes(ep.our_episode_id)"
                 @change="selectedIds.includes(ep.our_episode_id) ? selectedIds.splice(selectedIds.indexOf(ep.our_episode_id), 1) : selectedIds.push(ep.our_episode_id)"
                 class="checkbox flex-shrink-0 mt-1" :disabled="!ep.our_episode_id">
          <div class="min-w-0 flex-1">
            <template x-if="ep.status === 'ready' && ep.our_episode_id">
              <a :href="'/episodes/' + ep.our_episode_id" class="text-sm font-medium truncate" style="display:inline;" x-text="ep.title"></a>
            </template>
            <template x-if="ep.status !== 'ready' || !ep.our_episode_id">
              <span class="text-sm font-medium truncate" x-text="ep.title"></span>
            </template>
            <div x-show="ep.duration || ep.published_at" style="font-size:0.75rem;color:var(--text-tertiary);margin-top:2px;">
              <span x-show="ep.published_at" x-text="new Date(ep.published_at).toLocaleDateString('da-DK', {day:'numeric', month:'short', year:'numeric'})"></span>
              <span x-show="ep.duration" x-text="' · ' + formatDuration(ep.duration)"></span>
            </div>
            <div x-show="ep.model_used" style="font-size:0.75rem;color:var(--text-tertiary);margin-top:1px;" x-text="ep.model_used + (ep.processing_seconds ? ' · ' + Math.round(ep.processing_seconds / 60) + 'm' : '') + (ep.cost != null ? ' · $' + parseFloat(ep.cost).toFixed(4) : '')"></div>
            <div x-show="ep.status === 'error' && ep.error_message" style="font-size:0.688rem;color:#f3727f;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="ep.error_message"></div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <template x-if="ep.queued && ep.status === 'new'">
              <span class="badge badge-yellow">queued</span>
            </template>
            <template x-if="!ep.queued && (ep.status === 'none' || ep.status === 'new')">
              <span class="badge badge-gray">Not transcribed</span>
            </template>
            <template x-if="ep.status === 'processing'">
              <span class="badge badge-dot badge-blue">Processing</span>
            </template>
            <template x-if="ep.status === 'ready'">
              <a :href="'/episodes/' + ep.our_episode_id" class="badge badge-green">Transcribed</a>
            </template>
            <template x-if="ep.status === 'error'">
              <div class="flex items-center gap-2">
                <span class="badge badge-red">Error</span>
                <button @click="processEpisode(ep.our_episode_id)" :disabled="!ep.our_episode_id" class="btn btn-ghost btn-sm" style="color:var(--accent);">Retry</button>
              </div>
            </template>
            <button x-show="(ep.status === 'none' || ep.status === 'new') && ep.our_episode_id && !ep.queued"
                    @click="processEpisode(ep.our_episode_id)" class="btn btn-primary btn-sm">Transcribe</button>
            <button x-show="ep.status === 'new' && ep.queued"
                    class="btn btn-ghost btn-sm" style="opacity:0.6;" disabled>Queued</button>
          </div>
        </div>
      </template>
      <div x-show="filteredEpisodes.length === 0 && !loading" class="text-center" style="padding:24px;color:var(--text-tertiary);font-size:0.875rem;">
        No items found
      </div>
    </div>
  </div>
</div>

<style>[x-cloak] { display: none !important; }</style>
<script>
function itemDetail() {
  return {
    absItemId: '{{ abs_item_id }}',
    loading: true,
    item: {},
    episodes: [],
    selectedIds: [],
    transcribing: false,
    autoProcess: false,
    statusFilter: 'all',
    statusFilters: [
      {key: 'all', label: 'All'},
      {key: 'new', label: 'New'},
      {key: 'processing', label: 'Processing'},
      {key: 'ready', label: 'Done'},
      {key: 'error', label: 'Error'},
    ],

    get filteredEpisodes() {
      if (this.statusFilter === 'all') return this.episodes;
      if (this.statusFilter === 'processing') {
        return this.episodes.filter(e => ['processing','downloading','transcribing','summarizing','indexing'].includes(e.status));
      }
      return this.episodes.filter(e => e.status === this.statusFilter);
    },

    formatDuration(seconds) {
      if (!seconds) return '';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      if (m >= 60) { const h = Math.floor(m / 60); return h + 'h ' + (m % 60) + 'm'; }
      return m + 'm ' + s + 's';
    },

    async loadItem() {
      this.loading = true;
      try {
        const r = await fetch('/api/abs/items/' + this.absItemId);
        const data = await r.json();
        this.item = data;
        this.episodes = data.episodes || [];
        this.autoProcess = data.auto_process || false;
      } catch (e) { console.error('Failed to load item', e); }
      this.loading = false;
    },

    async toggleAutoProcess() {
      const val = !this.autoProcess;
      await fetch('/api/abs/items/' + this.absItemId + '/auto-process', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({auto_process: val}),
      });
      this.autoProcess = val;
    },

    async processEpisode(epId) {
      if (!epId) return;
      this.transcribing = true;
      try { await fetch('/api/episodes/' + epId + '/process', { method: 'POST' }); await this.loadItem(); }
      catch (e) { console.error('Failed', e); }
      this.transcribing = false;
    },

    selectAll(event) {
      if (event.target.checked) this.selectedIds = this.episodes.filter(e => e.our_episode_id).map(e => e.our_episode_id);
      else this.selectedIds = [];
    },

    async transcribeSelected() {
      if (this.selectedIds.length === 0) return;
      this.transcribing = true;
      try {
        await fetch('/api/episodes/process-batch', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ids: this.selectedIds}),
        });
        this.selectedIds = [];
        await this.loadItem();
      } catch (e) { console.error('Failed', e); }
      this.transcribing = false;
    },

    async enqueueAllPending() {
      this.transcribing = true;
      try { await fetch('/api/abs/items/' + this.absItemId + '/enqueue-pending', { method: 'POST' }); await this.loadItem(); }
      catch (e) { console.error('Failed', e); }
      this.transcribing = false;
    },
  };
}
</script>
{% endblock %}
