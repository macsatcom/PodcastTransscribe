{% extends "base.html" %}
{% block content %}
<div x-data="queueView()" x-init="loadQueue(); startPolling()">
  <div class="flex items-start justify-between mb-6">
    <div>
      <h1 class="page-title">Queue</h1>
      <div class="flex items-center gap-4 mt-2">
        <div class="flex items-center gap-2 text-sm text-secondary">
          <div class="status-dot green"></div>
          <span x-text="qm.workers"></span> workers
        </div>
        <div x-show="qm.queue_size > 0" class="flex items-center gap-2 text-sm text-secondary">
          <span x-text="qm.queue_size + ' in queue'"></span>
        </div>
        <div x-show="qm.running_count > 0" class="flex items-center gap-2 text-sm text-secondary">
          <div class="spinner" style="width:14px;height:14px;"></div>
          <span x-text="qm.running_count + ' processing'"></span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button @click="processAllPending()" class="btn btn-primary" :disabled="processingAll"
              x-text="processingAll ? 'Enqueuing...' : 'Process All Pending'">
      </button>
      <div class="flex items-center gap-4">
        <span x-show="counts.running > 0" class="flex items-center gap-2 text-sm font-medium" style="color:#539df5;">
          <div class="spinner" style="width:14px;height:14px;border-top-color:#539df5;"></div>
          <span x-text="counts.running"></span> running
        </span>
        <span class="text-sm font-medium" style="color:#ffa42b;" x-show="counts.queued > 0" x-text="counts.queued + ' in queue'"></span>
        <span class="text-sm font-medium text-red" x-show="counts.error > 0" x-text="counts.error + ' failed'"></span>
        <span class="text-sm font-medium text-tertiary" x-text="counts.done + ' completed'"></span>
        <span x-show="counts.new_total > counts.queued" class="text-2xs text-tertiary" x-text="'(' + counts.new_total + ' new in DB)'"></span>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-6">
    <!-- Running -->
    <div x-show="running.length > 0">
      <h2 class="section-title mb-3">Running</h2>
      <div class="flex flex-col gap-1">
        <template x-for="ep in running" :key="ep.id">
          <a :href="'/episodes/' + ep.id" class="table-row" style="background:rgba(83,157,245,0.06);">
            <div class="spinner flex-shrink-0" style="width:14px;height:14px;border-top-color:#539df5;"></div>
            <div class="min-w-0 flex-1">
              <span class="text-sm font-medium truncate" x-text="ep.title"></span>
              <span class="text-2xs text-secondary ml-2" x-text="ep.podcast_title"></span>
            </div>
            <span class="badge badge-dot badge-blue flex-shrink-0" x-text="ep.status"></span>
          </a>
        </template>
      </div>
    </div>

    <!-- Queued -->
    <div x-show="queued.length > 0">
      <h2 class="section-title mb-3">In Queue</h2>
      <div class="flex flex-col gap-1">
        <template x-for="ep in queued" :key="ep.id">
          <a :href="'/episodes/' + ep.id" class="table-row">
            <div class="status-dot yellow flex-shrink-0"></div>
            <div class="min-w-0 flex-1">
              <span class="text-sm font-medium truncate" x-text="ep.title"></span>
              <span class="text-2xs text-secondary ml-2" x-text="ep.podcast_title"></span>
            </div>
            <span class="badge badge-yellow flex-shrink-0">queued</span>
          </a>
        </template>
      </div>
    </div>

    <!-- Error -->
    <div x-show="error.length > 0">
      <h2 class="section-title mb-3">Failed</h2>
      <div class="flex flex-col gap-1">
        <template x-for="ep in error" :key="ep.id">
          <div class="table-row">
            <div class="status-dot red flex-shrink-0"></div>
            <div class="min-w-0 flex-1">
              <a :href="'/episodes/' + ep.id" class="text-sm font-medium truncate link-underline" style="display:inline;" x-text="ep.title"></a>
              <span class="text-2xs text-secondary ml-2" x-text="ep.podcast_title"></span>
              <p x-show="ep.error_message" class="text-2xs text-red mt-1 truncate" x-text="ep.error_message"></p>
            </div>
            <span class="badge badge-red flex-shrink-0">failed</span>
          </div>
        </template>
      </div>
    </div>

    <!-- Completed -->
    <div x-show="done.length > 0">
      <h2 class="section-title mb-3">Completed</h2>
      <div class="flex flex-col gap-1">
        <template x-for="ep in done" :key="ep.id">
          <a :href="'/episodes/' + ep.id" class="table-row" style="opacity:0.6;">
            <div class="status-dot green flex-shrink-0"></div>
            <div class="min-w-0 flex-1">
              <span class="text-sm font-medium truncate" x-text="ep.title"></span>
              <span class="text-2xs text-secondary ml-2" x-text="ep.podcast_title"></span>
            </div>
            <span class="badge badge-green flex-shrink-0">completed</span>
          </a>
        </template>
      </div>
    </div>

    <!-- Empty state -->
    <div x-show="totalItems() === 0" class="empty-state">
      <div class="empty-state-icon">&#x2693;</div>
      <p class="font-bold">Queue is empty</p>
      <p class="text-sm mt-1">No episodes are queued for processing.</p>
    </div>
  </div>
</div>

<script>
function queueView() {
  return {
    running: [], queued: [], error: [], done: [],
    counts: { running: 0, queued: 0, error: 0, done: 0, new_total: 0 },
    qm: {}, pollTimer: null, processingAll: false,

    totalItems() { return this.running.length + this.queued.length + this.error.length + this.done.length; },

    async processAllPending() {
      this.processingAll = true;
      try { await fetch('/api/episodes/process-all-pending', { method: 'POST' }); await this.loadQueue(); }
      catch (e) { console.error('Failed to enqueue', e); }
      this.processingAll = false;
    },

    async loadQueue() {
      try {
        const r = await fetch('/api/queue');
        const data = await r.json();
        this.running = data.running; this.queued = data.queued; this.error = data.error; this.done = data.done;
        this.counts = data.counts || {}; this.qm = data.queue_manager || {};
      } catch (e) { console.error('Failed to load queue', e); }
    },

    startPolling() {
      this.loadQueue();
      this.pollTimer = setInterval(() => { this.loadQueue(); }, 2000);
    }
  };
}
</script>
{% endblock %}
