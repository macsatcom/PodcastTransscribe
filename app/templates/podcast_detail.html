{% extends "base.html" %}
{% block content %}
<div x-data="podcastDetail()" x-init="loadPodcast()">
  <a href="/" class="text-sm font-medium text-secondary hover:text-primary mb-4 inline-block" style="display:flex;align-items:center;gap:4px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>

  <div x-show="loading" class="flex items-center gap-4 mb-6">
    <div class="skeleton" style="width:64px;height:64px;border-radius:6px;"></div>
    <div class="flex-1 flex flex-col gap-2">
      <div class="skeleton" style="width:60%;height:28px;"></div>
      <div class="skeleton" style="width:30%;height:14px;"></div>
    </div>
  </div>

  <div x-show="!loading" class="mb-6">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-4">
        <template x-if="podcast.cover_url">
          <img :src="podcast.cover_url" style="width:64px;height:64px;border-radius:6px;flex-shrink:0;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,0.5);">
        </template>
        <div>
          <h1 class="page-title" x-text="podcast.title"></h1>
          <p class="text-sm text-secondary" x-text="podcast.author || ''"></p>
          <p x-show="podcast.description" class="text-xs text-tertiary mt-1 line-clamp-2" x-text="podcast.description"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <button @click="showEdit = true" class="btn btn-ghost btn-sm">Edit</button>
        <button @click="confirmDelete()" class="btn btn-ghost btn-sm text-red">Delete</button>
      </div>
    </div>

    <div class="flex items-center gap-4 mt-4">
      <label class="flex items-center gap-2 text-sm cursor-pointer">
        <input type="checkbox" :checked="podcast.auto_process" @change="toggleAutoProcess()" class="checkbox">
        <span class="font-medium">Auto-process</span>
      </label>
      <button @click="pollNow()" class="btn btn-ghost btn-sm" x-text="polling ? 'Polling...' : 'Poll Now'"></button>
    </div>
    <p x-show="pollResult" x-text="pollResult" class="text-xs text-tertiary mt-2"></p>
  </div>

  <!-- Edit Modal -->
  <div x-show="showEdit" x-cloak class="modal-overlay">
    <div class="modal" @click.outside="showEdit = false">
      <h2 class="modal-title">Edit Podcast</h2>
      <form @submit.prevent="saveEdit()" class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Title</label>
          <input x-model="editTitle" required class="input">
        </div>
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Author</label>
          <input x-model="editAuthor" class="input">
        </div>
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Description</label>
          <textarea x-model="editDescription" rows="3" class="input"></textarea>
        </div>
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Cover URL</label>
          <input x-model="editCoverUrl" class="input">
        </div>
        <div>
          <label class="text-xs font-medium text-secondary" style="display:block;margin-bottom:4px;">Language</label>
          <input x-model="editLanguage" placeholder="e.g. en" class="input">
        </div>
        <div class="flex justify-end gap-2 mt-2">
          <button type="button" @click="showEdit = false" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary" x-text="saving ? 'Saving...' : 'Save'"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div x-show="deleteTarget" x-cloak class="modal-overlay">
    <div class="modal">
      <h2 class="modal-title">Delete Podcast?</h2>
      <p class="text-sm text-secondary mb-4">This will permanently delete this podcast and all its episodes.</p>
      <div class="flex justify-end gap-2">
        <button @click="deleteTarget = false" class="btn btn-ghost">Cancel</button>
        <button @click="deletePodcast()" class="btn btn-danger" x-text="deleting ? 'Deleting...' : 'Delete'"></button>
      </div>
    </div>
  </div>

  <!-- Episodes -->
  <div x-show="!loadingEpisodes" class="mb-4 flex flex-col gap-3">
    <input type="text" x-model="filterText" placeholder="Search episodes..." class="input input-pill">

    <div class="tabs">
      <button @click="statusFilter = ''" class="tab" :class="{ active: statusFilter === '' }">All</button>
      <button @click="statusFilter = 'new'" class="tab" :class="{ active: statusFilter === 'new' }">New</button>
      <button @click="statusFilter = 'processing'" class="tab" :class="{ active: statusFilter === 'processing' }">Processing</button>
      <button @click="statusFilter = 'ready'" class="tab" :class="{ active: statusFilter === 'ready' }">Ready</button>
      <button @click="statusFilter = 'error'" class="tab" :class="{ active: statusFilter === 'error' }">Error</button>
    </div>

    <div class="flex items-center gap-3">
       <label class="flex items-center gap-2 text-xs font-medium text-secondary cursor-pointer">
         <input type="checkbox" :checked="allFilteredSelected" @change="toggleSelectAll()" class="checkbox"> Select all
       </label>
      <button @click="processSelected()" x-show="selectedIds.length > 0"
              class="btn btn-primary btn-sm" x-text="'Process Selected (' + selectedIds.length + ')'">
      </button>
      <button @click="processAll()" x-text="processingAll ? 'Processing...' : 'Process All Pending'"
              class="btn btn-secondary btn-sm" :disabled="processingAll">
      </button>
      <span class="text-xs text-tertiary" x-text="filteredEpisodes.length + ' of ' + episodes.length"></span>
      <span x-show="processAllResult" x-text="processAllResult" class="text-xs text-accent"></span>
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <div x-show="loadingEpisodes" class="flex items-center gap-3 text-sm text-secondary" style="padding:24px 0;">
      <div class="spinner"></div> Loading episodes...
    </div>
    <template x-for="ep in filteredEpisodes" :key="ep.id">
      <div class="flex items-start gap-3" style="padding:12px 16px;background:var(--bg-surface);border-radius:6px;border:1px solid var(--border-subtle);transition:border-color 0.15s;">
        <input type="checkbox" :checked="selectedIds.includes(ep.id)" @change="toggleSelect(ep.id)"
               class="checkbox flex-shrink-0 mt-1">
        <a :href="'/episodes/' + ep.id" class="min-w-0 flex-1">
          <div style="font-size:0.875rem;font-weight:600;line-height:1.5;">
            <span x-text="ep.title"></span>
            <span x-show="ep.description" style="font-size:0.75rem;font-weight:400;color:var(--text-secondary);"> &mdash; <span x-text="ep.description"></span></span>
          </div>
          <div style="font-size:0.75rem;color:var(--text-tertiary);margin-top:2px;">
            <span x-text="ep.published_at ? new Date(ep.published_at).toLocaleDateString('da-DK',{day:'2-digit',month:'short'}) : ''"></span>
            <span x-show="ep.duration_seconds" x-text="' · ' + Math.floor(ep.duration_seconds / 60) + 'm'"></span>
          </div>
          <div x-show="ep.model_used" style="font-size:0.75rem;color:var(--text-tertiary);margin-top:1px;" x-text="ep.model_used + (ep.processing_seconds ? ' · ' + Math.round(ep.processing_seconds / 60) + 'm' : '') + (ep.cost ? ' · $' + ep.cost.toFixed(4) : '')"></div>
        </a>
        <div class="flex items-center gap-2 flex-shrink-0">
          <template x-if="ep.queued && ep.status === 'new'">
            <span class="badge badge-yellow">queued</span>
          </template>
          <template x-if="!ep.queued || ep.status !== 'new'">
            <span class="badge"
                  :class="{
                    'badge-gray': ep.status === 'new',
                    'badge-blue badge-dot': ['downloading','transcribing','summarizing','indexing','processing'].includes(ep.status),
                    'badge-green': ep.status === 'ready',
                    'badge-red': ep.status === 'error',
                  }"
                  x-text="ep.status">
            </span>
          </template>
          <button x-show="(ep.status === 'new' && !ep.queued) || ep.status === 'error'"
                  @click="processEpisode(ep)"
                  class="btn btn-primary btn-sm" x-text="ep.processing ? '...' : 'Process'"
                  :disabled="ep.processing === true">
          </button>
          <button x-show="ep.status === 'new' && ep.queued"
                  class="btn btn-ghost btn-sm" style="opacity:0.6;" disabled>Queued</button>
          <button x-show="['downloading','transcribing','summarizing','indexing','processing'].includes(ep.status) || ep.status === 'error'"
                  @click="resetEpisode(ep)"
                  class="btn btn-ghost btn-sm" style="color:#ffa42b;">Reset</button>
        </div>
      </div>
    </template>
    <div x-show="!loadingEpisodes && filteredEpisodes.length === 0" class="empty-state">
      <p class="font-medium text-sm">No episodes match your filter</p>
    </div>
  </div>
</div>

<script>
function podcastDetail() {
  return {
    podcastId: '{{ podcast_id }}',
    loading: true, loadingEpisodes: true,
    podcast: {}, episodes: [],
    polling: false, pollResult: '',
    processingAll: false, processAllResult: '',
    filterText: '', statusFilter: '',
    selectedIds: [],
    showEdit: false, editTitle: '', editAuthor: '', editDescription: '', editCoverUrl: '', editLanguage: '',
    saving: false, deleteTarget: false, deleting: false,

    get filteredEpisodes() {
      let list = this.episodes;
      if (this.filterText) {
        const q = this.filterText.toLowerCase();
        list = list.filter(e => (e.title && e.title.toLowerCase().includes(q)) || (e.description && e.description.toLowerCase().includes(q)));
      }
      if (this.statusFilter) {
        list = list.filter(e => {
          if (this.statusFilter === 'processing') return ['downloading','transcribing','summarizing','indexing','processing'].includes(e.status);
          return e.status === this.statusFilter;
        });
      }
      return list;
    },    get allFilteredSelected() {
      return this.filteredEpisodes.length > 0
        && this.filteredEpisodes.every(e => this.selectedIds.includes(e.id));
    },


    toggleSelect(id) { const idx = this.selectedIds.indexOf(id); if (idx > -1) this.selectedIds.splice(idx, 1); else this.selectedIds.push(id); },

    toggleSelectAll() {
      if (this.allFilteredSelected) {
        const filteredIds = new Set(this.filteredEpisodes.map(e => e.id));
        this.selectedIds = this.selectedIds.filter(id => !filteredIds.has(id));
      } else {
        for (const ep of this.filteredEpisodes) {
          if (!this.selectedIds.includes(ep.id)) this.selectedIds.push(ep.id);
        }
      }
    },

    async loadPodcast() {
      const r = await fetch('/api/podcasts/' + this.podcastId);
      this.podcast = await r.json();
      this.editTitle = this.podcast.title || ''; this.editAuthor = this.podcast.author || '';
      this.editDescription = this.podcast.description || ''; this.editCoverUrl = this.podcast.cover_url || '';
      this.editLanguage = this.podcast.language || '';
      this.loading = false; await this.loadEpisodes();
    },

    async loadEpisodes() {
      this.loadingEpisodes = true;
      const r = await fetch('/api/episodes?podcast_id=' + this.podcastId);
      this.episodes = (await r.json()).map(e => ({...e, processing: false}));
      this.loadingEpisodes = false;
    },

    async toggleAutoProcess() {
      await fetch('/api/podcasts/' + this.podcastId, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({auto_process: !this.podcast.auto_process}),
      });
      this.podcast.auto_process = !this.podcast.auto_process;
    },

    async pollNow() {
      this.polling = true; this.pollResult = '';
      const r = await fetch('/api/podcasts/' + this.podcastId + '/poll', { method: 'POST' });
      if (r.ok) { this.pollResult = 'Polled!'; await this.loadEpisodes(); }
      else { this.pollResult = 'Poll failed.'; }
      this.polling = false; setTimeout(() => this.pollResult = '', 3000);
    },

    async saveEdit() {
      this.saving = true;
      const r = await fetch('/api/podcasts/' + this.podcastId, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title: this.editTitle, author: this.editAuthor, description: this.editDescription, cover_url: this.editCoverUrl, language: this.editLanguage}),
      });
      if (r.ok) { const updated = await r.json(); Object.assign(this.podcast, updated); }
      this.showEdit = false; this.saving = false;
    },

    confirmDelete() { this.deleteTarget = true; },

    async deletePodcast() {
      this.deleting = true;
      const r = await fetch('/api/podcasts/' + this.podcastId, { method: 'DELETE' });
      if (r.ok) window.location.href = '/';
      this.deleting = false;
    },

    async resetEpisode(ep) {
      ep.processing = true;
      await fetch('/api/episodes/' + ep.id + '/reset', { method: 'POST' });
      ep.status = 'new'; ep.processing = false;
    },

    async processEpisode(ep) {
      ep.processing = true;
      try { await fetch('/api/episodes/' + ep.id + '/process', { method: 'POST' }); }
      catch (e) { ep.status = 'error'; ep.error_message = 'Failed to start processing'; ep.processing = false; return; }
      ep.status = 'processing';
      const poll = setInterval(async () => {
        try {
          const r = await fetch('/api/episodes/' + ep.id);
          const data = await r.json();
          ep.status = data.status; ep.error_message = data.error_message;
          if (!['downloading','transcribing','summarizing','indexing','processing'].includes(data.status || '')) { clearInterval(poll); ep.processing = false; }
        } catch (e) { clearInterval(poll); ep.processing = false; }
      }, 3000);
    },

    async processSelected() {
      const ids = [...this.selectedIds]; this.selectedIds = [];
      try {
        const r = await fetch('/api/episodes/process-batch', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ids}) });
        const data = await r.json();
        this.processAllResult = 'Enqueued ' + (data.count || ids.length) + ' episode(s).';
        await this.loadEpisodes();
      } catch (e) { this.processAllResult = 'Batch processing failed.'; }
      setTimeout(() => this.processAllResult = '', 4000);
    },

    async processAll() {
      this.processingAll = true; this.processAllResult = '';
      try {
        const r = await fetch('/api/episodes/process-all-pending', { method: 'POST' });
        const data = await r.json();
        this.processAllResult = 'Enqueued ' + (data.count || 0) + ' episode(s).';
        await this.loadEpisodes();
      } catch (e) { this.processAllResult = 'Batch processing failed.'; }
      this.processingAll = false; setTimeout(() => this.processAllResult = '', 6000);
    }
  };
}
</script>
{% endblock %}
