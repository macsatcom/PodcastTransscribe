{% extends "base.html" %}
{% block content %}
<div x-data="podcastDetail()" x-init="loadPodcast()">
  <a href="/" class="text-emerald-400 hover:text-emerald-300 text-sm mb-4 inline-block">&larr; Back</a>

  <div x-show="loading" class="animate-pulse h-8 w-64 bg-gray-800 rounded mb-6"></div>

  <div x-show="!loading" class="mb-6">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-4">
        <template x-if="podcast.cover_url">
          <img :src="podcast.cover_url" class="w-16 h-16 rounded flex-shrink-0">
        </template>
        <div>
          <h1 class="text-2xl font-bold" x-text="podcast.title"></h1>
          <p class="text-gray-400 text-sm" x-text="podcast.author || ''"></p>
          <p x-show="podcast.description" class="text-gray-500 text-xs mt-1 line-clamp-2" x-text="podcast.description"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <button @click="showEdit = true" class="text-xs text-gray-400 hover:text-white px-2 py-1 rounded bg-gray-800 hover:bg-gray-700">Edit</button>
        <button @click="confirmDelete()" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 rounded bg-gray-800 hover:bg-gray-700">Delete</button>
      </div>
    </div>

    <div class="flex items-center gap-4 mt-4">
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" :checked="podcast.auto_process" @change="toggleAutoProcess()">
        Auto-process
      </label>
      <button @click="pollNow()"
              class="text-sm text-emerald-400 hover:text-emerald-300"
              x-text="polling ? 'Polling...' : 'Poll Now'">
      </button>
    </div>

    <p x-show="pollResult" x-text="pollResult" class="text-xs text-gray-500 mt-1"></p>
  </div>

  <div x-show="showEdit" x-cloak class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <form class="bg-gray-900 p-6 rounded-lg border border-gray-700 w-full max-w-md" @submit.prevent="saveEdit()">
      <h2 class="text-lg font-bold mb-4">Edit Podcast</h2>
      <label class="block mb-2 text-sm">Title</label>
      <input x-model="editTitle" required class="w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-sm">
      <label class="block mb-2 text-sm">Author</label>
      <input x-model="editAuthor" class="w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-sm">
      <label class="block mb-2 text-sm">Description</label>
      <textarea x-model="editDescription" rows="3" class="w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-sm"></textarea>
      <label class="block mb-2 text-sm">Cover URL</label>
      <input x-model="editCoverUrl" class="w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-sm">
      <label class="block mb-2 text-sm">Language</label>
      <input x-model="editLanguage" placeholder="e.g. en" class="w-full mb-4 p-2 rounded bg-gray-800 border border-gray-700 text-sm">
      <div class="flex justify-end gap-2">
        <button type="button" @click="showEdit = false" class="px-3 py-1.5 rounded bg-gray-700 text-sm">Cancel</button>
        <button type="submit" class="px-3 py-1.5 rounded bg-emerald-600 text-sm" x-text="saving ? 'Saving...' : 'Save'"></button>
      </div>
    </form>
  </div>

  <div x-show="deleteTarget" x-cloak class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-gray-900 p-6 rounded-lg border border-gray-700 w-full max-w-sm">
      <h2 class="text-lg font-bold mb-2">Delete Podcast?</h2>
      <p class="text-sm text-gray-400 mb-4">This will permanently delete this podcast and all its episodes.</p>
      <div class="flex justify-end gap-2">
        <button @click="deleteTarget = false" class="px-3 py-1.5 rounded bg-gray-700 text-sm">Cancel</button>
        <button @click="deletePodcast()" class="px-3 py-1.5 rounded bg-red-700 text-sm" x-text="deleting ? 'Deleting...' : 'Delete'"></button>
      </div>
    </div>
  </div>

  <div x-show="!loadingEpisodes" class="mb-4 space-y-3">
    <input type="text" x-model="filterText" placeholder="Search episodes..."
           class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-sm">

    <div class="flex flex-wrap gap-1.5">
      <button @click="statusFilter = ''" class="text-xs px-2.5 py-1 rounded"
              :class="statusFilter === '' ? 'bg-emerald-700 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'">All</button>
      <button @click="statusFilter = 'new'" class="text-xs px-2.5 py-1 rounded"
              :class="statusFilter === 'new' ? 'bg-emerald-700 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'">New</button>
      <button @click="statusFilter = 'processing'" class="text-xs px-2.5 py-1 rounded"
              :class="statusFilter === 'processing' ? 'bg-emerald-700 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'">Processing</button>
      <button @click="statusFilter = 'ready'" class="text-xs px-2.5 py-1 rounded"
              :class="statusFilter === 'ready' ? 'bg-emerald-700 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'">Ready</button>
      <button @click="statusFilter = 'error'" class="text-xs px-2.5 py-1 rounded"
              :class="statusFilter === 'error' ? 'bg-emerald-700 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'">Error</button>
    </div>

    <div class="flex items-center gap-3">
      <label class="flex items-center gap-1.5 text-xs text-gray-500">
        <input type="checkbox" @change="selectAll = !selectAll; toggleSelectAll()">
        Select all
      </label>
      <button @click="processSelected()" x-show="selectedIds.length > 0"
              class="bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded text-xs font-medium"
              x-text="'Process Selected (' + selectedIds.length + ')'">
      </button>
      <button @click="processAll()" x-text="processingAll ? 'Processing...' : 'Process All Pending'"
              class="bg-emerald-800 hover:bg-emerald-700 px-3 py-1.5 rounded text-xs font-medium disabled:opacity-50"
              :disabled="processingAll">
      </button>
      <span x-text="filteredEpisodes.length + ' of ' + episodes.length + ' episodes'" class="text-xs text-gray-500"></span>
      <span x-show="processAllResult" x-text="processAllResult" class="text-xs text-gray-500"></span>
    </div>
  </div>

  <div class="space-y-2">
    <template x-if="loadingEpisodes">
      <p class="text-gray-500">Loading episodes...</p>
    </template>
    <template x-for="ep in filteredEpisodes" :key="ep.id">
      <div class="flex items-start justify-between p-3 bg-gray-900 rounded-lg border border-gray-800 hover:border-emerald-700 transition gap-3">
        <div class="flex items-start gap-2 min-w-0 flex-1">
          <input type="checkbox" :checked="selectedIds.includes(ep.id)" @change="toggleSelect(ep.id)"
                 class="mt-1 rounded bg-gray-800 border-gray-600 flex-shrink-0">
          <a :href="'/episodes/' + ep.id" class="min-w-0 flex-1">
            <div class="text-sm font-medium truncate" x-text="ep.title"></div>
            <div class="text-xs text-gray-500" x-text="ep.published_at || ''"></div>
            <div x-show="ep.model_used" class="text-xs text-gray-600" x-text="ep.model_used + (ep.processing_seconds ? ' · ' + Math.round(ep.processing_seconds / 60) + ' min' : '')"></div>
            <div x-show="ep.description" class="text-xs text-gray-400 mt-1 line-clamp-2" x-text="ep.description"></div>
          </a>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <span class="text-xs px-2 py-0.5 rounded"
                :class="{
                  'bg-gray-700 text-gray-300': ep.status === 'new',
                  'bg-blue-700 text-blue-200': ['downloading','transcribing','summarizing','indexing','processing'].includes(ep.status),
                  'bg-emerald-700 text-emerald-200': ep.status === 'ready',
                  'bg-red-700 text-red-200': ep.status === 'error',
                }"
                x-text="ep.status">
          </span>
          <button x-show="ep.status === 'new' || ep.status === 'error'"
                  @click="processEpisode(ep)"
                  x-text="ep.processing ? '...' : 'Process'"
                  :disabled="ep.processing"
                  class="text-xs text-emerald-400 hover:text-emerald-300 disabled:text-gray-600">
          </button>
        </div>
      </div>
    </template>
    <p x-show="!loadingEpisodes && filteredEpisodes.length === 0" class="text-gray-500">No episodes match your filter.</p>
  </div>
</div>

<script>
function podcastDetail() {
  return {
    podcastId: '{{ podcast_id }}',
    loading: true,
    loadingEpisodes: true,
    podcast: {},
    episodes: [],
    polling: false,
    pollResult: '',
    processingAll: false,
    processAllResult: '',
    filterText: '',
    statusFilter: '',
    selectedIds: [],
    selectAll: false,
    showEdit: false,
    editTitle: '',
    editAuthor: '',
    editDescription: '',
    editCoverUrl: '',
    editLanguage: '',
    saving: false,
    deleteTarget: false,
    deleting: false,

    get filteredEpisodes() {
      let list = this.episodes;
      if (this.filterText) {
        const q = this.filterText.toLowerCase();
        list = list.filter(e =>
          (e.title && e.title.toLowerCase().includes(q)) ||
          (e.description && e.description.toLowerCase().includes(q))
        );
      }
      if (this.statusFilter) {
        list = list.filter(e => {
          if (this.statusFilter === 'processing') return ['downloading','transcribing','summarizing','indexing','processing'].includes(e.status);
          return e.status === this.statusFilter;
        });
      }
      return list;
    },

    toggleSelect(id) {
      const idx = this.selectedIds.indexOf(id);
      if (idx > -1) this.selectedIds.splice(idx, 1);
      else this.selectedIds.push(id);
    },

    toggleSelectAll() {
      if (this.selectAll) {
        this.selectedIds = this.filteredEpisodes.map(e => e.id);
      } else {
        this.selectedIds = [];
      }
    },

    async loadPodcast() {
      const r = await fetch('/api/podcasts/' + this.podcastId);
      this.podcast = await r.json();
      this.editTitle = this.podcast.title || '';
      this.editAuthor = this.podcast.author || '';
      this.editDescription = this.podcast.description || '';
      this.editCoverUrl = this.podcast.cover_url || '';
      this.editLanguage = this.podcast.language || '';
      this.loading = false;
      await this.loadEpisodes();
    },

    async loadEpisodes() {
      this.loadingEpisodes = true;
      const r = await fetch('/api/episodes?podcast_id=' + this.podcastId);
      this.episodes = await r.json();
      this.loadingEpisodes = false;
    },

    async toggleAutoProcess() {
      await fetch('/api/podcasts/' + this.podcastId, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({auto_process: !this.podcast.auto_process}),
      });
      this.podcast.auto_process = !this.podcast.auto_process;
    },

    async pollNow() {
      this.polling = true;
      this.pollResult = '';
      const r = await fetch('/api/podcasts/' + this.podcastId + '/poll', { method: 'POST' });
      if (r.ok) {
        this.pollResult = 'Polled! New episodes will appear shortly.';
        await this.loadEpisodes();
      } else {
        this.pollResult = 'Poll failed.';
      }
      this.polling = false;
      setTimeout(() => this.pollResult = '', 3000);
    },

    async saveEdit() {
      this.saving = true;
      const r = await fetch('/api/podcasts/' + this.podcastId, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          title: this.editTitle,
          author: this.editAuthor,
          description: this.editDescription,
          cover_url: this.editCoverUrl,
          language: this.editLanguage,
        }),
      });
      if (r.ok) {
        const updated = await r.json();
        Object.assign(this.podcast, updated);
      }
      this.showEdit = false;
      this.saving = false;
    },

    confirmDelete() {
      this.deleteTarget = true;
    },

    async deletePodcast() {
      this.deleting = true;
      const r = await fetch('/api/podcasts/' + this.podcastId, { method: 'DELETE' });
      if (r.ok) window.location.href = '/';
      this.deleting = false;
    },

    async processEpisode(ep) {
      ep.processing = true;
      await fetch('/api/episodes/' + ep.id + '/process', { method: 'POST' });
      ep.status = 'processing';
      const poll = setInterval(async () => {
        const r = await fetch('/api/episodes/' + ep.id);
        const data = await r.json();
        ep.status = data.status;
        ep.error_message = data.error_message;
        if (data.status !== 'processing' && data.status !== 'downloading' && data.status !== 'transcribing' && data.status !== 'summarizing' && data.status !== 'indexing') {
          clearInterval(poll);
          ep.processing = false;
        }
      }, 2000);
    },

    async processSelected() {
      for (const id of this.selectedIds) {
        const ep = this.episodes.find(e => e.id === id);
        if (ep && (ep.status === 'new' || ep.status === 'error')) {
          await this.processEpisode(ep);
        }
      }
      this.selectedIds = [];
    },

    async processAll() {
      this.processingAll = true;
      this.processAllResult = '';
      const pending = this.episodes.filter(e => e.status === 'new' || e.status === 'error');
      for (const ep of pending) {
        await this.processEpisode(ep);
      }
      this.processAllResult = `Started processing ${pending.length} episode(s).`;
      this.processingAll = false;
      setTimeout(() => this.processAllResult = '', 4000);
    }
  };
}
</script>
{% endblock %}
