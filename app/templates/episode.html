{% extends "base.html" %}
{% block content %}
<div x-data="episodeView()" x-init="loadEpisode()">
  <a href="/" class="text-emerald-400 hover:text-emerald-300 text-sm mb-4 inline-block">&larr; Back</a>

  <div x-show="loading" class="animate-pulse h-8 w-64 bg-gray-800 rounded mb-2"></div>

  <div x-show="!loading" class="mb-6">
    <h1 class="text-2xl font-bold" x-text="episode.title"></h1>
    <p class="text-gray-400 text-sm mt-1" x-text="(episode.published_at || '') + ' · ' + episode.status"></p>
    <p x-show="episode.error_message" class="text-red-400 text-sm mt-1" x-text="episode.error_message"></p>
    <button x-show="episode.status === 'new' || episode.status === 'error'"
            @click="process()" :disabled="processing"
            class="mt-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-4 py-2 rounded text-sm"
            x-text="processing ? 'Processing...' : (episode.status === 'error' ? 'Retry' : 'Process Now')">
    </button>
  </div>

  <div x-show="!loading && transcript && transcript.summary" class="mb-6 p-4 bg-gray-900 rounded-lg border border-gray-800">
    <h2 class="text-sm font-semibold text-emerald-400 mb-2">Summary</h2>
    <div class="text-sm leading-relaxed" x-text="transcript.summary"></div>
  </div>

  <div x-show="!loading && transcript && transcript.full_text" class="text-sm leading-relaxed whitespace-pre-wrap"
       x-html="highlightedText">
  </div>

  <p x-show="!loading && episode.status === 'ready' && !transcript" class="text-gray-500">No transcript available.</p>
  <p x-show="!loading && episode.status === 'new' && !transcript" class="text-gray-500">Episode not yet processed.</p>
  <p x-show="!loading && episode.status === 'processing'" class="text-gray-500">Processing episode...</p>
</div>

<script>
function episodeView() {
  return {
    episodeId: '{{ episode_id }}',
    loading: true,
    processing: false,
    episode: {},
    transcript: null,

    async loadEpisode() {
      this.loading = true;
      const r = await fetch('/api/episodes/' + this.episodeId);
      const data = await r.json();
      this.episode = data;
      this.transcript = data.transcript || null;
      this.loading = false;
    },

    get highlightedText() {
      if (!this.transcript || !this.transcript.full_text) return '';
      const params = new URLSearchParams(window.location.search);
      const highlight = params.get('q');
      let text = this.transcript.full_text;
      if (highlight) {
        text = text.replace(
          new RegExp('(' + highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
          '<mark class="bg-emerald-700 text-emerald-200 px-0.5 rounded">$1</mark>'
        );
      }
      return text;
    },

    async process() {
      this.processing = true;
      await fetch('/api/episodes/' + this.episodeId + '/process', { method: 'POST' });
      this.episode.status = 'processing';
      const poll = setInterval(async () => {
        const r = await fetch('/api/episodes/' + this.episodeId);
        const data = await r.json();
        this.episode = data;
        this.transcript = data.transcript || null;
        if (data.status !== 'processing' && data.status !== 'downloading' && data.status !== 'transcribing' && data.status !== 'summarizing' && data.status !== 'indexing') {
          clearInterval(poll);
          this.processing = false;
        }
      }, 2000);
    }
  };
}
</script>
{% endblock %}
